name: Build NA Frame Counter

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  test-core:
    name: Core Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and run unit tests
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -Werror -Isrc \
            src/math/NandlCalculator.cpp \
            src/math/SubFrame.cpp \
            src/math/CbfDetector.cpp \
            src/core/FrameConfig.cpp \
            tests/test_core.cpp \
            -o test_core
          ./test_core

  diagnose:
    name: Diagnose SDK setup
    runs-on: ubuntu-latest
    # Diagnostics only - never blocks the build. Reports results through
    # check-run annotations (::error:: / ::warning::) because the raw job log
    # is not always retrievable, while annotations are.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Geode CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v4.0.2 -R geode-sdk/cli -p 'geode-cli-v4.0.2-linux.zip' -D /tmp/cli || {
            echo "::error::CLI download failed"; exit 0; }
          unzip -o /tmp/cli/geode-cli-v4.0.2-linux.zip -d /tmp/geode-cli >/dev/null
          chmod +x /tmp/geode-cli/geode
          /tmp/geode-cli/geode --version || echo "::warning::geode --version failed"

      - name: Reproduce SDK setup with real exit codes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="/tmp/geode-cli:$PATH"
          export CLI_PROFILE="$PWD/cli-profile"
          mkdir -p "$CLI_PROFILE/geode/mods" "$CLI_PROFILE/Contents/geode/mods"

          report() {   # report <label> <logfile>
            local code="$1" label="$2" log="$3"
            if [ "$code" -ne 0 ]; then
              echo "::error::DIAG $label exited $code"
              # surface the last few meaningful lines as annotations
              grep -iE "error|fail|cannot|unable|not found|denied|rate.?limit" "$log" | tail -6 | while IFS= read -r line; do
                line="${line:0:400}"
                echo "::error::DIAG[$label] $line"
              done
              tail -3 "$log" | while IFS= read -r line; do
                echo "::warning::DIAG[$label] tail: ${line:0:400}"
              done
            else
              echo "::warning::DIAG $label OK"
            fi
          }

          geode profile add --name GithubActions "$CLI_PROFILE/GeometryDash.exe" win >/tmp/1.log 2>&1
          report $? "profile-add" /tmp/1.log

          geode sdk install "$PWD/geode-sdk-clone" >/tmp/2.log 2>&1
          report $? "sdk-install" /tmp/2.log

          export GEODE_SDK="$PWD/geode-sdk-clone"
          geode sdk update 5.11.2 >/tmp/3.log 2>&1
          report $? "sdk-update-5.11.2" /tmp/3.log

          geode sdk install-binaries --platform android64 --version 5.11.2 >/tmp/4.log 2>&1
          report $? "install-binaries" /tmp/4.log

      - name: Configure this mod with the real SDK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          export PATH="/tmp/geode-cli:$PATH"
          export CLI_PROFILE="$PWD/cli-profile"
          export GEODE_SDK="$PWD/geode-sdk-clone"

          echo "::warning::DIAG GEODE_SDK=$GEODE_SDK"
          if [ ! -d "$GEODE_SDK" ]; then
            echo "::error::DIAG SDK directory missing at $GEODE_SDK"; exit 0
          fi
          echo "::warning::DIAG sdk tree: $(ls "$GEODE_SDK" | tr '\n' ' ')"
          echo "::warning::DIAG cmake version: $(cmake --version | head -1)"
          echo "::warning::DIAG ninja: $(ninja --version 2>&1 | head -1)"

          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGEODE_DONT_INSTALL_MODS=ON -DGEODE_TARGET_PLATFORM=Win64 -G Ninja >/tmp/cfg.log 2>&1
          code=$?
          echo "::warning::DIAG cmake-configure exit=$code"
          if [ $code -ne 0 ]; then
            n=0
            while IFS= read -r line && [ $n -lt 8 ]; do
              echo "::error::DIAG[configure] ${line:0:400}"
              n=$((n+1))
            done < <(grep -iE "error|fatal|cannot|unable|not found|unknown|requires" /tmp/cfg.log | tail -8)
            if [ "$n" -eq 0 ]; then
              tail -6 /tmp/cfg.log | while IFS= read -r line; do
                echo "::error::DIAG[configure-tail] ${line:0:400}"
              done
            fi
          fi
        continue-on-error: true

  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64

          - name: macOS
            os: macos-latest
            target: MacOS

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: Build (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Geode mod
        env:
          # The Geode CLI resolves release/binaries through api.github.com
          # (see `install_binaries`). Without a token those calls are
          # unauthenticated and get rate-limited, which fails every platform at
          # the SDK-setup step, long before compilation. The action does not
          # forward a token itself.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Pinned deliberately. @main is a moving target and picked up a
        # Windows-only `choco upgrade llvm` step (ca5481b4, "temp enable llvm
        # update", 2026-11-20) which breaks the Windows build. This commit is
        # the parent of that hack and is the newest revision that still has the
        # required new-runner CMake fix (-DCMAKE_CXX_SCAN_FOR_MODULES=OFF,
        # d13abbb9). Do NOT pin earlier: without that flag, CMake's C++ module
        # scanner runs on current runners and configure fails.
        uses: geode-sdk/build-geode-mod@d13abbb93e69f737b7fdfaac37450c14083898c2
        with:
          sdk: given
          combine: true
          target: ${{ matrix.config.target }}
          # Pin the Geode CLI. The action defaults this to "latest", downloading
          # a fresh CLI on every run - so a CLI release silently changes the
          # build. Geode CLI 4.0.0 (2026-10-30) rewrote profile/SDK path
          # handling ("Set sdk default path in $XDG_DATA_HOME") and broke the
          # `geode sdk update <ver>` + `sdk install-binaries` sequence this
          # action relies on. 3.9.0 is the last release before that rewrite.
          cli: v3.9.0

  package:
    name: Combine & Package
    runs-on: ubuntu-latest
    needs: ['test-core', 'build']

    steps:
      - name: Combine platform builds
        # Pinned alongside the build action above, so combine can't drift either.
        uses: geode-sdk/build-geode-mod/combine@d13abbb93e69f737b7fdfaac37450c14083898c2
        id: combine
        with:
          zstd: true
          optimize-pngs: true

      - name: Upload combined .geode artifact
        uses: actions/upload-artifact@v7
        with:
          name: na-frame-counter-geode
          path: ${{ steps.combine.outputs.build-output }}

      - name: Create Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_OUTPUT: ${{ steps.combine.outputs.build-output }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$BUILD_OUTPUT"/*.geode \
            --generate-notes \
            --verify-tag
